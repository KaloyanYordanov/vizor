<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vizor Embed Sample – Direct iframe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <h1>Vizor Embedding Demo (iframe only)</h1>
  <p>This page shows the <strong>iframe</strong> option directly. You don't need the embeddable script at all.</p>
  <p><a href="./index.html">Back to script loader demo &raquo;</a></p>

  <!-- direct iframe; change the src to match your Vizor host and project -->
  <iframe
    src="http://localhost:3030/view/horizon/sunrise-residences"
    width="100%" height="800" frameborder="0"
    allowfullscreen loading="lazy"
  ></iframe>

  <p>Adjust query parameters (<code>target</code>, <code>width</code>, etc.) via the URL if you prefer the script approach.</p>
</body>
</html>
